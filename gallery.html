<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>AI 샷 — 갤러리</title>
<link rel="icon" type="image/png" href="assets/img/favicon.png?v=2">
<link rel="apple-touch-icon" href="assets/img/icon-192.png">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#0F1417">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="stylesheet" href="assets/fonts/pretendard.css?v=2">
<link rel="stylesheet" href="css/all.min.css?v=2">
<link rel="stylesheet" href="css/app.css?v=2">
</head>
<body class="gal">

<header data-tab="gallery.html"></header>

<div id="galMain">

  <section class="galsec">
    <div class="gh">
      <span>사진</span>
      <span class="st-badge" id="phCount"></span>
      <span style="flex:1"></span>
      <button class="db" id="phZip" disabled title="전부 zip 으로"><i class="fa-solid fa-file-zipper"></i></button>
      <button class="db danger" id="phClear" disabled title="전부 지우기"><i class="fa-solid fa-trash"></i></button>
    </div>
    <div id="phEmpty" style="display:none">
      <img src="assets/img/pibo-idea.png" alt="">
      아직 찍은 사진이 없어요.<br>
      <a href="index.html">카메라</a>에서 동작으로 찍어 보세요.
    </div>
    <div id="phGrid"></div>
  </section>

  <section class="galsec">
    <div class="gh"><span>내가 가르친 동작</span></div>
    <div id="mdEmpty" style="display:none">
      아직 만든 동작이 없어요.<br>
      <a href="index.html">카메라</a>의 학습에서 가르쳐 보세요.
    </div>
    <div id="mdList"></div>
    <div class="dropzone" id="dropZone">
      내보낸 zip 을 여기에 놓으면 다시 들어와요
    </div>
    <input type="file" id="impFile" accept=".zip" style="display:none">
  </section>

</div>

<div id="viewer">
  <img id="vImg" alt="">
  <div class="vbar">
    <span class="vmeta" id="vMeta"></span>
    <button class="db" id="vDown"><i class="fa-solid fa-download"></i> 내려받기</button>
    <button class="db danger" id="vDel"><i class="fa-solid fa-trash"></i> 지우기</button>
    <span style="flex:1"></span>
    <button class="db" id="vClose"><i class="fa-solid fa-xmark"></i> 닫기</button>
  </div>
</div>

<div id="toast"></div>

<script src="lib/nav.js?v=2"></script>
<script src="lib/i18n.js?v=2"></script>
<script src="lib/tour.js?v=2"></script>
<script src="vendor/tfjs/tf.min.js"></script>
<script src="lib/jszip.min.js"></script>
<script type="module" src="lib/gallery.js?v=2"></script>
</body>
</html>
